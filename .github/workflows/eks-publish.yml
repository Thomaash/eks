name: eks publish

on:
  push:
    branches: [main]
    paths:
      - "packages/eks/**"
      - ".github/workflows/eks-publish.yml"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.4

      - name: Run eks test suite
        run: deno test packages/eks/ --allow-env --allow-read --allow-run --allow-sys --allow-write

      - name: Publish to JSR
        working-directory: packages/eks
        run: deno publish
